_base_: default.yaml

# Supervised LoRA tuning for DocVQA with Qwen3-VL.
# Requires split CSVs with valid image_path values and qwen-vl-utils installed.

train:
  num_epochs: 3
  batch_size: 1
  accumulation: 4

evaluation:
  gate_metric: soft
  sel_env_num: 32
  test_env_num: 0

lora:
  model_name: Qwen/Qwen3.5-4B
  architecture: vision_lm
  learning_rate: 0.0002
  weight_decay: 0.0
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  max_prompt_tokens: 16384
  # 0 = auto; DocVQA images are downscaled to leave room for text tokens.
  docvqa_max_image_tokens: 0
  max_target_tokens: 64
  max_new_tokens: 64
  torch_dtype: auto
  device: auto
  trust_remote_code: true
  generation_temperature: 0.0