_base_: default.yaml

# Supervised LoRA tuning for ALFWorld.
# This trains low-rank adapters on the same direct-answer or trajectory SFT
# examples used by the soft-prefix baseline.

train:
  num_epochs: 3
  batch_size: 4
  accumulation: 1

evaluation:
  gate_metric: soft
  sel_env_num: 64
  test_env_num: 0

model:
  target: gpt-4o
  target_backend: openai_chat
  reasoning_effort: ""

env:
  max_steps: 50
  max_completion_tokens: 16384
  workers: 8
  max_api_workers: 1
  limit: 0

lora:
  model_name: Qwen/Qwen3.5-4B
  learning_rate: 0.0002
  weight_decay: 0.0
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  max_prompt_tokens: 8192
  max_target_tokens: 512
  max_new_tokens: 128
  trajectory_max_new_tokens: 2048
  torch_dtype: auto
  device: auto
  trust_remote_code: false
  generation_temperature: 0.0
  training_data: trajectory_sft
  trajectory_rollout_backend: openai_compatible
  trajectory_rollout_dir: "rollouts/teacher_gpt4o_alfworld_rollouts"
  trajectory_min_hard: 1.0
  trajectory_min_soft: 0.0
  trajectory_max_examples: 0
  trajectory_max_context_chars: 30000
