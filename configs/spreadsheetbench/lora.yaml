_base_: default.yaml

# Supervised LoRA tuning for SpreadsheetBench trajectory SFT.
# This trains low-rank adapters on successful codegen-and-execution rollouts.

model:
  target: gpt-5.5
  target_backend: openai_chat

train:
  num_epochs: 3
  batch_size: 2
  accumulation: 1

evaluation:
  gate_metric: soft
  sel_env_num: 16
  test_env_num: 0

env:
  workers: 1

lora:
  model_name: Qwen/Qwen3.5-4B
  learning_rate: 0.0002
  weight_decay: 0.0
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  max_prompt_tokens: 16384
  max_target_tokens: 8192
  max_new_tokens: 8192
  trajectory_max_new_tokens: 16384
  torch_dtype: auto
  device: auto
  trust_remote_code: false
  init_text_path: skillopt/envs/spreadsheetbench/skills/initial.md
  generation_temperature: 0.0
  training_data: trajectory_sft
  trajectory_use_skill: true
  trajectory_rollout_backend: openai_compatible
  trajectory_rollout_dir: rollouts/teacher_gpt55_spreadsheetbench_rollouts
  trajectory_min_hard: 1.0
  trajectory_min_soft: 0.0
  trajectory_max_examples: 0
  trajectory_rollouts_per_task: 1
  trajectory_max_context_chars: 30000
  strip_trajectory_thoughts: true
