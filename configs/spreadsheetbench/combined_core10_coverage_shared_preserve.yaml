_base_: selective_distillation_stage2.yaml

# Coverage treatment paired with combined_core05_coverage_shared_preserve.
# Core coverage is the only changed training variable (5% -> 10%).
train:
  num_epochs: 1
  batch_size: 1
  accumulation: 2
  seed: 1

evaluation:
  sel_env_num: 40
  test_env_num: 0
  eval_test: false

env:
  generation_batch_size: 8
  checkpoint_eval_val: false

soft_prefix:
  prefix_length: 8
  trajectory_examples_path: outputs/SpreadsheetBench_selective_stage2_manifests/combined_top0.10_core_coverage_ablation.jsonl
  selective_label_field: selected_indices
  preservation_loss_weight: 1.0
  preservation_label_field: preserve_indices
  max_new_tokens: 4096
  checkpoint_path: ""
