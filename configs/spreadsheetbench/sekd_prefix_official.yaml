_base_: selective_distillation_stage2.yaml

# Official-Adapted SE-KD: retain the upstream student-entropy Top-20% selector
# and forward KL, while restricting optimization to the common length-8 prefix.
train:
  num_epochs: 1
  batch_size: 1
  accumulation: 2
  seed: 1

evaluation:
  sel_env_num: 40
  test_env_num: 0
  eval_test: false

env:
  generation_batch_size: 8

soft_prefix:
  max_new_tokens: 4096

official_baseline:
  method: sekd
  k_percent: 20.0
  temperature: 1.0
  entropy_chunk_size: 16
  kl_chunk_size: 16
  max_train_examples: 0
  eval_after_train: true
  official_root: third_party/official
