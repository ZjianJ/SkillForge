_base_: default.yaml

# Supervised soft-prefix tuning for LiveMathematicianBench.
# This config uses the multimodal Qwen3-VL wrapper so the same base family can
# be shared with DocVQA; override soft_prefix.architecture=causal_lm for a
# text-only causal LM checkpoint.

train:
  num_epochs: 3
  batch_size: 8
  accumulation: 1

evaluation:
  gate_metric: hard
  sel_env_num: 64
  test_env_num: 0

lora:
  model_name: Qwen/Qwen3.5-4B
  learning_rate: 0.0002
  weight_decay: 0.0
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  max_prompt_tokens: 2048
  max_target_tokens: 16
